name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: sudo apt-get install --yes cppcheck
      - run: bash firmware/scripts/run_cppcheck.sh

  firmware-tests:
    name: Firmware tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.16
      - name: Core tests and the network simulation
        run: pio test -e native -v

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: python -m pip install platformio==6.1.16
      - run: pio run -e esp32-s3 -e esp32-s3-octal
      - name: Only the proxy engine may transmit
        run: |
          if grep -rn 'chip\.send\|\.send(frame' src/*.cpp | grep -v 'src/radio_task.cpp'; then
            echo "Found a transmit call outside the radio port." >&2
            exit 1
          fi
      - name: Merge the images and check their flash settings
        run: |
          bash scripts/merge_firmware.sh esp32-s3 tado-gado-esp32s3-factory.bin
          bash scripts/merge_firmware.sh esp32-s3-octal tado-gado-esp32s3-octal-factory.bin
          version=$(tr -d '[:space:]' < ../VERSION)
          python scripts/check_image.py tado-gado-esp32s3-factory.bin dio 8MB esp32s3 "$version"
          python scripts/check_image.py tado-gado-esp32s3-octal-factory.bin dout 32MB esp32s3octal "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            firmware/tado-gado-esp32s3-factory.bin
            firmware/tado-gado-esp32s3-octal-factory.bin
          if-no-files-found: error
