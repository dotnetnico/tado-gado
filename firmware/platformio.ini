[platformio]
default_envs = esp32-s3, esp32-s3-octal

; ESP32-S3 boards with quad flash, such as the ESP32-S3-DevKitC-1-N8.
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    tzapu/WiFiManager@2.0.17
extra_scripts = pre:scripts/build_info.py
test_ignore = *

; ESP32-S3 boards with octal flash and PSRAM, such as the ESP32-S3-DevKitC-1-N32R16V
; with its ESP32-S3-WROOM-2 module. An image for quad flash does not boot on these.
[env:esp32-s3-octal]
extends = env:esp32-s3
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

; The radio-independent core, tested on the build machine.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:scripts/sanitize.py
